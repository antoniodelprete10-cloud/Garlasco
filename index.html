let pointers=new Map(),drag=null,pinch=0;canvas.onpointerdown=e=>{stop();updatePins();desired=null;pointers.set(e.pointerId,[e.clientX,e.clientY]);canvas.setPointerCapture(e.pointerId);drag=[e.clientX,e.clientY,firstPerson?fpYawOffset:yaw,firstPerson?fpPitchOffset:pitch];if(pointers.size===2){let a=[...pointers.values()];pinch=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])}};canvas.onpointermove=e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===2){let a=[...pointers.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);dist=Math.min(32,Math.max(3,dist*pinch/d));pinch=d}else if(drag){if(firstPerson){fpYawOffset=drag[2]-(e.clientX-drag[0])*.004;fpPitchOffset=Math.max(-.08,Math.min(.08,drag[3]+(e.clientY-drag[1])*.001));draw();return}yaw=drag[2]-(e.clientX-drag[0])*.008;pitch=Math.min(1.4,Math.max(.12,drag[3]+(e.clientY-drag[1])*.005))}draw()};canvas.onpointerup=canvas.onpointercancel=e=>{pointers.delete(e.pointerId);drag=null};canvas.onwheel=e=>{e.preventDefault();if(firstPerson){fpZoom=Math.max(.75,Math.min(1.5,fpZoom*Math.exp(-e.deltaY*.0005)));draw();return}stop();desired=null;dist=Math.max(3,Math.min(32,dist*Math.exp(e.deltaY*.001)));draw()};canvas.addEventListener('wheel',e=>e.preventDefault(),{passive:false});canvas.onkeydown=e=>{if(firstPerson){if(e.key==='ArrowLeft')fpYawOffset+=.12;else if(e.key==='ArrowRight')fpYawOffset-=.12;else if(e.key==='ArrowUp'||e.key==='ArrowDown'){stop();routeProgress=Math.max(0,Math.min(1,routeProgress+(e.key==='ArrowUp'?.012:-.012)));followCamera(routeProgress)}else return;e.preventDefault();draw();return}if(e.key==='ArrowLeft')yaw-=.12;else if(e.key==='ArrowRight')yaw+=.12;else if(e.key==='ArrowUp')dist=Math.max(3,dist-.6);else if(e.key==='ArrowDown')dist=Math.min(32,dist+.6);else return;e.preventDefault();draw()};window.addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});rebuild();renderEvidence();updatePins();resize();
</script></html>
